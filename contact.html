<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Main wrapper that holds all page content -->
    <div class="page">
        <!-- Navigation bar with links to each page -->
        <div class="navbar">
            <a href="index.html">Home</a>
            <a id="mid" href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
        <!-- Banner/header picture -->
        <figure class="bannerpicture">
            <img src="placeholder.jpg" alt="banner image">
        </figure>
        <!-- Main content area -->
        <main>
            <h1>Contact Me</h1>
            <p>Feel free to reach out to me!</p>
            <!-- Contact form -->
            <form>
                <!-- Email input -->
                <label for="email">email: </label>
                <input type="email" id="email" placeholder="Your Email">
                <!-- Message box -->
                <label for="message">Message: </label>
                <textarea id="message" placeholder="Your Message"></textarea>
                <!-- Radio buttons: choose one favourite course -->
                <div class="spacing">
                    <p>favourite course in school:</p>
                    <input type="radio" id="option1" name="course" value="math">
                    <!-- label for the first radio button -->
                    <label for="option1">math</label>
                    <input type="radio" id="option2" name="course" value="sciences">
                    <label for="option2">sciences</label>
                    <input type="radio" id="option3" name="course" value="performance art">
                    <label for="option3">performance art</label>
                    <input type="radio" id="option4" name="course" value="language and literature">
                    <label for="option4">language and literature</label>
                </div>
                <!-- Dropdown: choose preferred contact method -->
                <div class="spacing">
                    <p>prefered way to be contacted:</p>
                    <select name="contact">
                        <!-- option for dropdown -->
                        <option value="email">email</option>
                        <option value="text_message">text message</option>
                        <option value="phone_call">phone call</option>
                    </select>
                </div>
                <!-- Submit button -->
                <button class="btn" type="submit">Submit</button>
            </form>
        </main>
        <footer></footer>
    </div>
</body>

</html>
